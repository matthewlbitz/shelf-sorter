<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KTRU Shelf Sorter</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a href="/">KTRU Shelf Sorter</a>

      <nav class="topnav">
        <a href="/how-to.html">How to Use</a>
      </nav>
    </header>
      <div id="feedback" role="status" aria-live="assertive"></div>

      <section class="available-shelves panel">
        <section class="available-shelves">
          <div class="available-shelves-title">
            <span class="status-dot"></span>
            Available Shelves - Updated each morning, M-F
          </div>

          <div class="available-shelves-list">
            19A–19P
            <span>•</span>
            21A–21P
            <span>•</span>
            22A–22P
            <span>•</span>
            23A–23P
          </div>

          <p>Only take unsorted CDs from these shelves.</p>
        </section>
      </section>

      <div id="app">Loading…</div>
  </main>
</body>
</html>
